kafka:
  bootstrap_servers: "pkc-619z3.us-east1.gcp.confluent.cloud:9092"
  topic: "sample_data_orders"
  security_protocol: "SASL_SSL"
  sasl_mechanism: "PLAIN"
  starting_offsets: "earliest"
  max_offsets_per_trigger: 100
  secrets:
    scope: "confluent-kafka-key-value"
    key_name: "api_key"
    secret_name: "api_secret"

catalog: "dev"
schemas:
  bronze: "bronze"
  silver: "silver"
  gold: "gold"

checkpoint:
  volume: "checkpoints"          # UC Volume name inside the bronze schema
  bronze_events: "bronze/events_raw"