resources:
  jobs:

    # Hourly: check Silver data quality -> refresh Gold only if DQ passes
    orders_gold_refresh:
      name: orders_gold_refresh_${bundle.target}
      schedule:
        quartz_cron_expression: "0 5 * * * ?"     # every hour at :05
        timezone_id: America/New_York
        pause_status: ${var.schedule_pause}
      max_concurrent_runs: 1
      email_notifications:
        on_failure: [ "${var.alert_email}" ]

      tasks:
        - task_key: dq_gate
          environment_key: serverless_py
          spark_python_task:
            python_file: ../jobs/dq_gate.py
            parameters:
              - "--repo-root"
              - "${workspace.file_path}"
              - "--env"
              - "${bundle.target}"

        - task_key: refresh_gold
          depends_on:
            - task_key: dq_gate               # skipped if the gate fails
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_gold.id}
            full_refresh: false

      environments:
        - environment_key: serverless_py
          spec:
            environment_version: "2"
            dependencies:
              - pyyaml
